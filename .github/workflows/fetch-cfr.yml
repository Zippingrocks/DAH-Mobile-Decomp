name: Fetch CFR tool
on:
  push:
    paths:
      - '.github/workflows/fetch-cfr.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned CFR 0.152
        run: |
          curl -L --fail --retry 3 -o cfr-0.152.jar https://github.com/leibnitz27/cfr/releases/download/0.152/cfr-0.152.jar
          echo "f686e8f3ded377d7bc87d216a90e9e9512df4156e75b06c655a16648ae8765b2  cfr-0.152.jar" | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: cfr-0.152
          path: cfr-0.152.jar
          if-no-files-found: error
          retention-days: 1
